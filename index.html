<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FGF Fleet Optimizer</title>
<style>
*{box-sizing:border-box;font-family:sans-serif}
body{margin:0;background:#0b0f19;color:#e8eefc;padding:12px}
.w{max-width:1100px;margin:auto}
h1{font-size:1.3rem;text-align:center;margin:0 0 12px}
.b,.c,.f{background:#131a2a;border:1px solid #283552;border-radius:10px;padding:10px;margin-bottom:12px}
.r{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
select,button,input{background:#1a2338;color:#e8eefc;border:1px solid #283552;border-radius:7px;padding:6px 8px;font-size:.85rem}
button{font-weight:700}
.g{background:#059669}.bl{background:#2563eb}.rd{color:#f87171}
.fl{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}
.Beam{border-top:4px solid #38bdf8}.Ion{border-top:4px solid #c084fc}.Kinetic{border-top:4px solid #fb923c}
.sl{display:flex;align-items:center;gap:8px;background:#1a2338;border-radius:7px;padding:7px;margin-top:6px}
.n{width:24px;height:24px;border-radius:50%;background:#2563eb;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8rem}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.c{opacity:.5;margin:0}.c.on{opacity:1;border-color:#64748b}
.tg{font-size:.68rem;padding:2px 6px;border-radius:4px;font-weight:700}
.tg.Beam{background:#0c4a6e;color:#38bdf8}.tg.Ion{background:#3b0764;color:#c084fc}.tg.Kinetic{background:#431407;color:#fb923c}
.tr{display:grid;grid-template-columns:2.2fr 1fr;gap:5px}
.sk{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:6px;text-align:center;font-size:.68rem;color:#8f9ec2}
.sk input{width:100%;text-align:center;padding:4px 2px;margin-top:2px}
</style>
</head>
<body>
<div class="w">
<h1>FGF Space Fleet Optimizer (v5)</h1>
<div class="b">
  <div class="r">
    <select id="ship" onchange="calc()">
      <option value="Gram">Flagship: Gram (INT)</option>
      <option value="Opportunity">Flagship: Opportunity (ATK)</option>
      <option value="Demerzel">Flagship: Demerzel (ATK)</option>
      <option value="Gungnir">Flagship: Gungnir (Base)</option>
    </select>
    <select id="mode" onchange="calc()">
      <option value="dps">Max DPS</option>
      <option value="sustain">Balanced / Sustain</option>
    </select>
  </div>
  <div class="r" style="margin:0">
    <button onclick="pre('f2p')">F2P</button>
    <button onclick="pre('max')">Max All</button>
    <button class="rd" onclick="pre('rst')">Reset</button>
    <button class="g" onclick="sv()">Save</button>
    <button onclick="ld(1)">Load</button>
  </div>
</div>
<div class="fl" id="out"></div>
<div class="r" id="tb">
  <button class="bl" onclick="flt('All',this)">All</button>
  <button onclick="flt('Beam',this)">Beam</button>
  <button onclick="flt('Ion',this)">Ion</button>
  <button onclick="flt('Kinetic',this)">Kinetic</button>
</div>
<div class="gr" id="ls"></div>
</div>
<script>
const C_NAME="Green,Yellow,Orange,Red,Purple Prism,Aqua Prism".split(",");
const C_MULT="0.85,1.12,1.42,1.76,2.15,2.55".split(",").map(Number);
const P_NAME="1★,2★,3★,4★,5★".split(",");
const P_MULT="1,1.06,1.12,1.18,1.26".split(",").map(Number);
const RAW="teresa|Teresa Lopez|Beam|Leg|INT|Def/Heal|3|108|35;evan|Evan Rogers|Beam|Leg|ATK|DPS Carry|3|105|0;aliya|Aliya|Beam|Leg|ATK|Slot-1 Buff|1|100|8;ramos|Ramos Moai (S2)|Beam|Leg|ATK|Atk/Supp|2|104|10;doug|Doug Rockwell|Beam|Leg|INT|Healer|3|94|32;lucius|Lucius Pullo|Beam|Epic|ATK|Budget DPS|2|74|0;klara|Klara|Beam|Epic|INT|Budget Heal|3|72|22;ajita|Ajita|Ion|Leg|INT|Supp/Heal|1|110|34;lily|Lily|Ion|Leg|ATK|DPS Carry|3|112|0;jodie|Jodie Béart|Ion|Leg|ATK|Setup/Buff|1|102|6;kama|Kama Moai|Ion|Epic|INT|Budget DPS|2|76|0;phade|Phade|Ion|Epic|INT|Budget Supp|1|70|18;zora|Zora Domini|Kinetic|Leg|INT|DPS Carry|3|114|5;bee|Killer Bee|Kinetic|Leg|ATK|DPS/Sustain|2|106|14;eva|Eva von Trier|Kinetic|Leg|INT|Setup/Debuff|1|104|10;cocoon|Cocoon|Kinetic|Leg|INT|Def/Shield|2|98|36;riian|Riian Dessos|Kinetic|Epic|ATK|Budget DPS|2|73|0;lani|Lani Verita|Kinetic|Epic|ATK|Budget Atk|2|71|0;s2|S2 Banner Hero|Kinetic|Leg|ATK|Custom S2|2|108|12";
const D=RAW.split(";").map(r=>{let a=r.split("|");return{id:a.at(0),nm:a.at(1),tp:a.at(2),rr:a.at(3),st:a.at(4),rl:a.at(5),sl:+a.at(6),pw:+a.at(7),sb:+a.at(8)};});
let S={},F="All";
D.forEach(x=>{S[x.id]={o:x.rr=="Epic",c:x.rr=="Epic"?1:2,p:2,s1:8,s2:6,s3:5,s4:1,t:x.tp};});
function setV(id,k,v){S[id][k]=v;if(k=="o"||k=="t")draw();calc();}
function draw(){
  let h="";
  D.forEach(x=>{
    let s=S[x.id],tp=x.id=="s2"?s.t:x.tp,p=s.p||0,cIdx=Math.min(s.c,5);
    if(F!="All"&&tp!=F)return;
    let co=C_NAME.map((v,i)=>'<option value="'+i+'"'+(cIdx==i?' selected':'')+'>'+v+'</option>').join("");
    let po=P_NAME.map((v,i)=>'<option value="'+i+'"'+(p==i?' selected':'')+'>'+v+'</option>').join("");
    let cs=x.id=="s2"?'<select style="width:100%;margin-bottom:5px" onchange="setV(\'s2\',\'t\',this.value)"><option'+(s.t=="Beam"?" selected":"")+'>Beam</option><option'+(s.t=="Ion"?" selected":"")+'>Ion</option><option'+(s.t=="Kinetic"?" selected":"")+'>Kinetic</option></select>':'';
    h+='<div class="c'+(s.o?' on':'')+'"><div class="r" style="justify-content:space-between"><b><input type="checkbox"'+(s.o?' checked':'')+' onchange="setV(\''+x.id+'\',\'o\',this.checked)"> '+x.nm+'</b><span class="tg '+tp+'">'+tp+'</span></div><div style="font-size:.74rem;color:#8f9ec2;margin-bottom:5px">'+x.rr+' • '+x.st+' • '+x.rl+'</div>'+cs+'<div class="tr"><select onchange="setV(\''+x.id+'\',\'c\',+this.value)">'+co+'</select><select onchange="setV(\''+x.id+'\',\'p\',+this.value)">'+po+'</select></div><div class="sk"><div>S1<input type="number" min="1" max="20" value="'+s.s1+'" onchange="setV(\''+x.id+'\',\'s1\',+this.value)"></div><div>S2<input type="number" min="1" max="20" value="'+s.s2+'" onchange="setV(\''+x.id+'\',\'s2\',+this.value)"></div><div>S3<input type="number" min="1" max="20" value="'+s.s3+'" onchange="setV(\''+x.id+'\',\'s3\',+this.value)"></div><div>S4<input type="number" min="0" max="20" value="'+s.s4+'" onchange="setV(\''+x.id+'\',\'s4\',+this.value)"></div></div></div>';
  });
  ls.innerHTML=h;
}
function calc(){
  let h="";
  "Beam,Ion,Kinetic".split(",").forEach(tp=>{
    let pk=D.map(x=>{
      let s=S[x.id],ct=x.id=="s2"?s.t:x.tp,p=s.p||0,cIdx=Math.min(s.c,5);
      if(!s.o)return null;
      let tm=C_MULT.at(cIdx)*P_MULT.at(p),aw=cIdx>=4||(cIdx==3&&p==4);
      let sk=1+(s.s1*.45+s.s2*.25+s.s3*.18+(aw?s.s4:s.s4*.35)*.12)*.085;
      let sc=x.pw*tm*sk+(mode.value=="sustain"?x.sb*tm:x.sb*.25);
      if(ship.value=="Gram"&&x.st=="INT")sc*=1.12;
      if((ship.value=="Opportunity"||ship.value=="Demerzel")&&x.st=="ATK")sc*=1.12;
      if(ct==tp)sc*=1.38;
      return{x:x,ct:ct,sc:Math.round(sc),lb:C_NAME.at(cIdx)+" "+P_NAME.at(p)};
    }).filter(Boolean).sort((a,b)=>b.sc-a.sc).slice(0,3).sort((a,b)=>a.x.sl-b.x.sl);
    let m=pk.filter(v=>v.ct==tp).length,rs=m==3?"+20% Res":m==2?"+10% Res":"0% Res";
    let sl=pk.length?pk.map((v,i)=>'<div class="sl"><div class="n">'+(i+1)+'</div><div style="flex:1"><b>'+v.x.nm+'</b><div style="font-size:.72rem;color:#8f9ec2">'+v.lb+' • '+v.x.rl+'</div></div><b style="color:#facc15">⚡'+v.sc+'</b></div>').join(""):'<p style="font-size:.8rem;color:#8f9ec2">Select heroes below.</p>';
    h+='<div class="f '+tp+'"><div class="r" style="justify-content:space-between;margin:0"><b>'+tp+' Fleet</b><span style="font-size:.74rem;color:#34d399">'+rs+'</span></div>'+sl+'</div>';
  });
  out.innerHTML=h;
}
function flt(t,b){F=t;document.querySelectorAll("#tb button").forEach(v=>v.className="");b.className="bl";draw();}
function pre(p){D.forEach(x=>{let s=S[x.id];if(p=="rst")s.o=0;if(p=="f2p"){s.o=x.rr=="Epic";s.c=1;s.p=4;s.s1=10;s.s2=8;s.s3=8;s.s4=1;}if(p=="max"){s.o=x.id!="s2";s.c=5;s.p=4;s.s1=15;s.s2=15;s.s3=15;s.s4=15;}});draw();calc();}
function sv(){localStorage.setItem("fgf5",JSON.stringify({S:S,sh:ship.value,md:mode.value}));alert("Saved!");}
function ld(n){let d=JSON.parse(localStorage.getItem("fgf5")||"null");if(!d)return;S=d.S;ship.value=d.sh;mode.value=d.md;draw();calc();if(n)alert("Loaded!");}
ld(0);draw();calc();
</script>
</body>
</html>
