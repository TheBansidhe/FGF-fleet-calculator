<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FGF Space Fleet Optimizer</title>
<style>
*{box-sizing:border-box;font-family:system-ui,sans-serif}
body{margin:0;background:#0b0f19;color:#e8eefc;padding:14px}
.wrap{max-width:1100px;margin:auto}
h1{font-size:1.4rem;text-align:center;margin:0 0 6px}
.sub{color:#8f9ec2;font-size:.88rem;text-align:center;margin:0 0 16px}
.bar,.card,.fleet{background:#131a2a;border:1px solid #283552;border-radius:12px;padding:12px;margin-bottom:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
select,button,input{background:#1a2338;color:#e8eefc;border:1px solid #283552;border-radius:8px;padding:7px 10px;font-size:.88rem}
button{font-weight:700;cursor:pointer}
.btn-g{background:#059669;border-color:#10b981}.btn-b{background:#2563eb;border-color:#3b82f6}.btn-r{color:#f87171;border-color:#7f1d1d}
.fleets{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px}
.fleet.Beam{border-top:4px solid #38bdf8}.fleet.Ion{border-top:4px solid #c084fc}.fleet.Kinetic{border-top:4px solid #fb923c}
.slot{display:flex;align-items:center;gap:10px;background:#1a2338;border-radius:8px;padding:8px;margin-top:8px}
.num{width:26px;height:26px;border-radius:50%;background:#2563eb;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.82rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.card{opacity:.55;margin:0}.card.on{opacity:1;border-color:#475569}
.tag{font-size:.7rem;padding:2px 6px;border-radius:5px;font-weight:700}
.Beam .tag,.tag.Beam{background:#0c4a6e;color:#38bdf8}.Ion .tag,.tag.Ion{background:#3b0764;color:#c084fc}.Kinetic .tag,.tag.Kinetic{background:#431407;color:#fb923c}
.sk{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:8px}
.sk div{text-align:center;font-size:.68rem;color:#8f9ec2}
.sk input{width:100%;text-align:center;padding:5px 2px;margin-top:2px}
</style>
</head>
<body>
<div class="wrap">
<h1>Foundation: Galactic Frontier — Space Fleet Optimizer</h1>
<p class="sub">Check your owned heroes, set Star Tier & 4 Space Skills, and view your optimal lineups.</p>
<div class="bar">
  <div class="row">
    <select id="ship" onchange="calc()">
      <option value="Gram">Flagship: Gram (INT/Sustain)</option>
      <option value="Opportunity">Flagship: Opportunity (ATK/Burst)</option>
      <option value="Demerzel">Flagship: Demerzel (ATK/PvP)</option>
      <option value="Gungnir">Flagship: Gungnir (Neutral)</option>
    </select>
    <select id="mode" onchange="calc()">
      <option value="dps">Strategy: Max DPS</option>
      <option value="sustain">Strategy: Balanced / Sustain</option>
    </select>
  </div>
  <div class="row" style="margin:0">
    <button onclick="preset('f2p')">F2P Starter</button>
    <button onclick="preset('max')">All Maxed</button>
    <button class="btn-r" onclick="preset('reset')">Reset All</button>
    <button class="btn-g" onclick="save()">Save Roster</button>
    <button onclick="load(1)">Load Saved</button>
  </div>
</div>
<div class="fleets" id="out"></div>
<div class="row" id="tabs">
  <button class="btn-b" onclick="filt('All',this)">All Champions</button>
  <button onclick="filt('Beam',this)">Beam</button>
  <button onclick="filt('Ion',this)">Ion</button>
  <button onclick="filt('Kinetic',this)">Kinetic</button>
</div>
<div class="grid" id="list"></div>
</div>
<script>
const STARS=[["Blue",1],["Purple",1.18],["Yellow",1.38],["Orange",1.62],["Red (Awakened)",1.92],["Rainbow",2.25]];
const DATA=[
["teresa","Teresa Lopez","Beam","Legendary","INT","Defense / Heal",3,108,35],
["evan","Evan Rogers","Beam","Legendary","ATK","DPS Carry",3,105,0],
["aliya","Aliya","Beam","Legendary","ATK","Slot-1 Buffer",1,100,8],
["ramos","Ramos Moai (S2)","Beam","Legendary","ATK","Attack / Support",2,104,10],
["doug","Doug Rockwell","Beam","Legendary","INT","Fleet Healer",3,94,32],
["lucius","Lucius Pullo","Beam","Epic","ATK","Budget Attack",2,74,0],
["klara","Klara","Beam","Epic","INT","Budget Healer",3,72,22],
["ajita","Ajita","Ion","Legendary","INT","Support / Healer",1,110,34],
["lily","Lily","Ion","Legendary","ATK","Primary DPS Carry",3,112,0],
["jodie","Jodie Béart","Ion","Legendary","ATK","Setup / Buffer",1,102,6],
["kama","Kama Moai","Ion","Epic","INT","Budget INT DPS",2,76,0],
["phade","Phade","Ion","Epic","INT","Budget Support",1,70,18],
["zora","Zora Domini","Kinetic","Legendary","INT","Primary DPS Carry",3,114,5],
["bee","Killer Bee","Kinetic","Legendary","ATK","DPS / Sustain",2,106,14],
["eva","Eva von Trier","Kinetic","Legendary","INT","Setup / Debuff",1,104,10],
["cocoon","Cocoon","Kinetic","Legendary","INT","Defense / Shielder",2,98,36],
["riian","Riian Dessos","Kinetic","Epic","ATK","Budget ATK DPS",2,73,0],
["lani","Lani Verita","Kinetic","Epic","ATK","Budget Attack",2,71,0],
["s2new","S2 New Banner Hero","Kinetic","Legendary","ATK","Custom S2 Slot",2,108,12]
];
let st={},cur="All";
DATA.forEach(c=>st[c[0]]={on:c[3]==="Epic",star:c[3]==="Epic"?1:2,s:[8,6,5,1],ct:c[2]});
function draw(){
  const el=document.getElementById("list");el.innerHTML="";
  DATA.forEach(c=>{
    const s=st[c[0]],tp=c[0]==="s2new"?s.ct:c[2];
    if(cur!=="All"&&tp!==cur)return;
    el.innerHTML+=`<div class="card ${s.on?'on':''}">
      <div class="row" style="justify-content:space-between">
        <label style="font-weight:700"><input type="checkbox" ${s.on?'checked':''} onchange="st['${c[0]}'].on=this.checked;draw();calc()"> ${c[1]}</label>
        <span class="tag ${tp}">${tp}</span>
      </div>
      <div style="font-size:.76rem;color:#8f9ec2;margin-bottom:6px">${c[3]} • ${c[4]} • ${c[5]}</div>
      ${c[0]==="s2new"?`<select style="width:100%;margin-bottom:6px" onchange="st.s2new.ct=this.value;draw();calc()">
        <option ${s.ct==="Beam"?"selected":""}>Beam</option><option ${s.ct==="Ion"?"selected":""}>Ion</option><option ${s.ct==="Kinetic"?"selected":""}>Kinetic</option>
      </select>`:""}
      <select style="width:100%" onchange="st['${c[0]}'].star=+this.value;calc()">
        ${STARS.map((x,i)=>`<option value="${i}" ${s.star===i?'selected':''}>Star: ${x[0]}</option>`).join("")}
      </select>
      <div class="sk">${[0,1,2,3].map(i=>`<div>S${i+1}<input type="number" min="0" max="20" value="${s.s[i]}" onchange="st['${c[0]}'].s[${i}]=+this.value;calc()"></div>`).join("")}</div>
    </div>`;
  });
}
function calc(){
  const ship=document.getElementById("ship").value,mode=document.getElementById("mode").value,out=document.getElementById("out");
  out.innerHTML="";
  ["Beam","Ion","Kinetic"].forEach(tp=>{
    const pick=DATA.map(c=>{
      const s=st[c[0]],ctp=c[0]==="s2new"?s.ct:c[2];
      if(!s.on)return null;
      const sk=1+(s.s[0]*.45+s.s[1]*.25+s.s[2]*.18+(s.star>=4?s.s[3]:s.s[3]*.35)*.12)*.085;
      let sc=c[7]*STARS[s.star][1]*sk+(mode==="sustain"?c[8]*STARS[s.star][1]:c[8]*.25);
      if(ship==="Gram"&&c[4]==="INT")sc*=1.12;
      if((ship==="Opportunity"||ship==="Demerzel")&&c[4]==="ATK")sc*=1.12;
      if(ctp===tp)sc*=1.38;
      return{c,tp:ctp,sc:Math.round(sc)};
    }).filter(Boolean).sort((a,b)=>b.sc-a.sc).slice(0,3).sort((a,b)=>a.c[6]-b.c[6]);
    const m=pick.filter(x=>x.tp===tp).length;
    out.innerHTML+=`<div class="fleet ${tp}">
      <div class="row" style="justify-content:space-between;margin:0">
        <b>${tp} Fleet</b><span style="font-size:.75rem;color:#34d399">${m===3?"+20% Resonance":m===2?"+10% Resonance":"0% Resonance"}</span>
      </div>
      ${pick.length?pick.map((x,i)=>`<div class="slot"><div class="num">${i+1}</div><div style="flex:1"><b>${x.c[1]}</b><div style="font-size:.75rem;color:#8f9ec2">${STARS[st[x.c[0]].star][0]} • ${x.c[5]}</div></div><b style="color:#facc15">⚡${x.sc}</b></div>`).join(""):`<p style="font-size:.82rem;color:#8f9ec2">Select owned heroes below.</p>`}
    </div>`;
  });
}
function filt(t,b){cur=t;document.querySelectorAll("#tabs button").forEach(x=>x.className="");b.className="btn-b";draw();}
function preset(p){
  DATA.forEach(c=>{
    if(p==="reset")st[c[0]].on=false;
    if(p==="f2p"){st[c[0]].on=c[3]==="Epic";st[c[0]].star=2;st[c[0]].s=[10,8,8,1];}
    if(p==="max"){st[c[0]].on=c[0]!=="s2new";st[c[0]].star=5;st[c[0]].s=[15,15,15,15];}
  });draw();calc();
}
function save(){localStorage.setItem("fgf_opt",JSON.stringify({st,ship:ship.value,mode:mode.value}));alert("Roster Saved!");}
function load(n){const d=JSON.parse(localStorage.getItem("fgf_opt")||"null");if(!d)return;st=d.st;ship.value=d.ship;mode.value=d.mode;draw();calc();if(n)alert("Roster Loaded!");}
load(0);draw();calc();
</script>
</body>
</html>
